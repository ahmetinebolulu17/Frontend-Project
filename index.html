  <script>
    (() => {
  const header = document.getElementById('siteHeader');
  const mobileMenu = document.getElementById('mobileMenu');
  if (!header) return;

  let lastY = window.scrollY;
  let ticking = false;
  const DELTA = 8; 

  const update = () => {
    const y = window.scrollY;

    header.classList.toggle('header-scrolled', y > 0);

    const menuOpen = mobileMenu && !mobileMenu.classList.contains('hidden')
      && window.innerWidth < 1024;

    if (menuOpen || y <= header.offsetHeight) {
      header.classList.remove('header-hidden');
    } else if (Math.abs(y - lastY) > DELTA) {
    
      header.classList.toggle('header-hidden', y > lastY);
    }

    lastY = y;
    ticking = false;
  };

  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  update();
})();
  </script>
  <script>
  document.querySelectorAll('#mobileMenu li.group').forEach(li => {
  const sub = li.querySelector('ul');
  if (!sub) return;

  const link = li.querySelector('a');
  const arrow = li.querySelector('.arrow-down');

  const toggleMenu = (e) => {
    if (window.innerWidth >= 1024) return;
    e.preventDefault();

    const closed = sub.classList.toggle('hidden');
    arrow.classList.toggle('rotate-180', closed);
    arrow.classList.toggle('rotate-0', !closed);
  };

  link.addEventListener('click', toggleMenu);
  arrow.addEventListener('click', toggleMenu);
});
  </script>
    <script>
    document.querySelectorAll('.footer-acc').forEach(box => {
  const toggle = box.querySelector('.footer-acc-toggle');
  const content = box.querySelector('.footer-acc-content');
  const arrow = box.querySelector('.arrow-down');

  toggle.addEventListener('click', () => {
    if (window.innerWidth >= 1024) return;   

    const closed = content.classList.toggle('hidden');
    arrow.classList.toggle('rotate-0', closed);
    arrow.classList.toggle('rotate-180', !closed);
  });
});
  </script>
<script>
  document.querySelectorAll('.footer-acc-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (window.innerWidth >= 1024) return; // masaüstünde hep açık

      const content = btn.nextElementSibling;
      const icon = btn.querySelector('.footer-acc-icon');
      const open = content.classList.contains('grid-rows-[0fr]');

      content.classList.toggle('grid-rows-[0fr]', !open);
      content.classList.toggle('grid-rows-[1fr]', open);
      icon.classList.toggle('rotate-90', !open);
      icon.classList.toggle('rotate-180', open);
    });
  });
</script>
<script>
  const accButtons = document.querySelectorAll('.acc-btn');

  const setAcc = (btn, open) => {
    btn.setAttribute('aria-expanded', String(open));
    const content = btn.nextElementSibling;
    const icon = btn.querySelector('.acc-icon');
    content.classList.toggle('grid-rows-[0fr]', !open);
    content.classList.toggle('grid-rows-[1fr]', open);
    icon.classList.toggle('fa-plus', !open);
    icon.classList.toggle('fa-minus', open);
  };

  accButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      const willOpen = btn.getAttribute('aria-expanded') !== 'true';
      accButtons.forEach((other) => {
        if (other !== btn) setAcc(other, false);
      });
      setAcc(btn, willOpen);
    });
  });
</script>
 <script>
  document.querySelectorAll('.drop-trigger').forEach(function (el) {
  el.addEventListener('click', function (e) {
    if (window.innerWidth >= 1024) return;
    e.preventDefault();
    var ul = el.parentElement.querySelector('ul');
    if (!ul) return;
    ul.classList.toggle('hidden');
    ul.classList.toggle('flex');
  });
});
  </script>
<script>
  function Deneme(x) {
    x.classList.toggle("change");
    const menu = document.getElementById("mobileMenu");
    menu.classList.toggle("hidden");
    menu.classList.toggle("flex");

    if (menu.classList.contains("hidden")) {
      lenis.start();
    } else {
      lenis.stop();
    }
  }

  window.addEventListener("resize", function () {
    if (window.innerWidth >= 1030) lenis.start();
  });
</script>
